<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creator Page Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #0b0a0c;
  --surface: #141216;
  --line: #262228;
  --fg: #f4f1f4;
  --muted: #9b939c;
  --accent: #ff3d8b;
  --accent-ink: #1a0610;
  --live: #4ade80;
  --font-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.live { background: var(--live); box-shadow: 0 0 0 4px color-mix(in srgb, var(--live) 18%, transparent); }
.dot.red { background: var(--accent); }

.top { border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; padding-block: 16px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 17px; display: flex; align-items: center; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; text-decoration: none; }

.hero { display: grid; grid-template-columns: auto 1fr; gap: 48px; align-items: center; padding-block: 64px 48px; }
.avatar-btn { position: relative; width: 200px; aspect-ratio: 1; max-width: 100%; border: 0; padding: 0; background: none; cursor: pointer; border-radius: 50%; }
.avatar-ring { position: absolute; inset: 0; border-radius: 50%; padding: 4px; background: conic-gradient(from 200deg, var(--accent), #ffb03d, #ff3d8b, #b43dff, var(--accent)); transition: transform .3s ease; }
.avatar-btn.seen .avatar-ring { background: var(--line); }
.avatar-btn:hover .avatar-ring { transform: scale(1.03); }
.avatar-inner { width: 100%; height: 100%; border-radius: 50%; border: 5px solid var(--bg); overflow: hidden; background: var(--surface); display: grid; place-items: center; }
.avatar-inner img { width: 100%; height: 100%; object-fit: cover; }
.avatar-initial { font-family: var(--font-display); font-weight: 800; font-size: 72px; color: var(--muted); }
.status { position: absolute; right: 2px; bottom: 18px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.tap-hint { display: block; text-align: center; margin-top: 12px; color: var(--muted); font-size: 12px; }

.identity { min-width: 0; display: grid; gap: 18px; }
.eyebrow { display: flex; align-items: center; gap: 8px; color: var(--muted); }
h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(44px, 8vw, 88px); line-height: .92; letter-spacing: -.02em; text-transform: uppercase; text-wrap: balance; overflow-wrap: anywhere; }
.tagline { margin: 0; color: var(--muted); font-size: 18px; max-width: 46ch; }
.stats { display: flex; flex-wrap: wrap; gap: 0; }
.stat { display: flex; align-items: baseline; gap: 6px; padding-inline: 16px; border-left: 1px solid var(--line); }
.stat:first-child { padding-left: 0; border-left: 0; }
.stat b { font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); }
.stat .flag { width: 22px; height: 15px; object-fit: cover; border-radius: 2px; align-self: center; }
.ctas { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 28px; border-radius: 6px; text-decoration: none; font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; transition: transform .15s ease, background .15s ease; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 85%, white); }
.btn.ghost { border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--muted); }

.strip { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding-block: 24px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.strip-left { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; min-width: 0; }
.strip h2 { margin: 0; font-size: 19px; font-weight: 700; }
.strip p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.textlink { color: var(--accent); text-decoration: none; padding-bottom: 6px; border-bottom: 1px solid var(--line); }

.content { padding-block: 32px 72px; }
.content-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.content-head .label { color: var(--accent); }
.content-head h2 { margin: 6px 0 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 5vw, 52px); line-height: 1; text-transform: uppercase; }
.head-right { display: flex; align-items: center; gap: 16px; }
.head-right .label { color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile { position: relative; aspect-ratio: 3/4; max-width: 100%; border-radius: 8px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; text-decoration: none; }
.tile img { width: 100%; height: 100%; object-fit: cover; }
.tile .ph { color: var(--muted); font-size: 12px; text-align: center; padding: 12px; }
.tile.private img { filter: blur(18px) brightness(.7); transform: scale(1.15); }
.tile .unlock { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 6px; text-align: center; padding: 12px; background: color-mix(in srgb, var(--bg) 25%, transparent); }
.tile .unlock svg { width: 54px; height: 54px; color: var(--accent); filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 70%, transparent)); }
.tile .unlock b { font-family: var(--font-display); font-weight: 800; font-size: 16px; letter-spacing: .02em; text-transform: uppercase; color: var(--fg); }
.tile .unlock small { font-size: 12px; color: var(--fg); opacity: .85; }
#vMedia.private img { filter: blur(24px) brightness(.7); transform: scale(1.15); }
.story-lock { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; display: grid; justify-items: center; gap: 8px; padding: 20px 28px; text-align: center; color: #fff; text-decoration: none; }
.story-lock svg { width: 72px; height: 72px; color: var(--accent); filter: drop-shadow(0 0 14px color-mix(in srgb, var(--accent) 70%, transparent)); }
.story-lock b { font-family: var(--font-display); font-weight: 800; font-size: 22px; text-transform: uppercase; white-space: nowrap; }
.story-lock small { font-size: 14px; opacity: .9; }
.tile .lock { position: absolute; left: 10px; bottom: 10px; padding: 4px 8px; border-radius: 4px; background: color-mix(in srgb, var(--bg) 80%, transparent); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
footer .wrap { padding-block: 20px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.viewer { position: fixed; inset: 0; z-index: 50; background: #000; display: grid; place-items: center; }
.stage { position: relative; width: min(100vw, calc(100dvh * 9 / 16)); height: 100dvh; max-height: 100dvh; background: #111; overflow: hidden; user-select: none; -webkit-user-select: none; }
@media (min-width: 700px) { .stage { height: min(92dvh, 860px); width: calc(min(92dvh, 860px) * 9 / 16); border-radius: 14px; } }
.stage img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.story-ph { width: 100%; height: 100%; display: grid; place-items: center; text-align: center; padding: 32px; font-family: var(--font-display); font-weight: 800; font-size: 28px; color: #fff; }
.bars { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; right: 10px; display: flex; gap: 4px; z-index: 3; }
.bar { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: #fff; }
.vhead { position: absolute; top: calc(22px + env(safe-area-inset-top, 0px)); left: 12px; right: 8px; display: flex; align-items: center; gap: 10px; z-index: 3; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
.vhead .mini { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; background: #333; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.vhead .mini img { width: 100%; height: 100%; object-fit: cover; }
.vhead b { font-size: 14px; }
.vhead .close { margin-left: auto; width: 40px; height: 40px; border: 0; background: none; color: #fff; font-size: 26px; cursor: pointer; }
.caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 18px calc(22px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, rgba(0,0,0,.65)); color: #fff; font-size: 15px; z-index: 2; }
.caption a { display: inline-block; margin-top: 10px; padding: 10px 16px; border-radius: 999px; background: #fff; color: #000; font-weight: 700; font-size: 13px; text-decoration: none; position: relative; z-index: 4; }
.tap { position: absolute; top: 0; bottom: 0; width: 35%; z-index: 1; border: 0; background: none; cursor: pointer; }
.tap.prev { left: 0; } .tap.next { right: 0; width: 65%; }

@media (max-width: 820px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 640px) {
  .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 28px; padding-block: 40px 32px; }
  .avatar-btn { width: 168px; }
  .eyebrow, .stats, .ctas { justify-content: center; }
  .tagline { margin-inline: auto; }
  .ctas .btn { flex: 1 1 100%; }
  .grid { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.modal-back { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.75); display: grid; place-items: center; padding: 16px; }
.modal { position: relative; width: min(420px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: #1c1b20; border-radius: 14px; padding: 30px 22px 22px; text-align: center; display: grid; gap: 12px; }
.modal .x { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 20px; cursor: pointer; }
.modal .eb { color: var(--accent); }
.modal h3 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: 1.1; }
.modal .head { margin: 0; font-weight: 700; font-size: 16px; }
.modal ol { list-style: none; margin: 0; padding: 0; color: var(--muted); font-size: 14px; line-height: 1.8; }
.modal .pic { max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--surface); }
.modal .pic img { display: block; width: 100%; height: auto; }
.modal .ph { display: grid; place-items: center; aspect-ratio: 4/3; color: var(--muted); font-size: 13px; }
.modal .btn { width: 100%; }

footer a { color: var(--muted); }
footer a:hover { color: var(--fg); }
.config-error { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 80; background: #b91c1c; color: #fff; padding: 12px 20px; font-weight: 700; font-size: 14px; }
</style>
</head>
<body>

<div id="configError" class="config-error" hidden></div>

<header class="top">
  <div class="wrap">
    <div class="brand"><span id="brandName">Creator</span><span class="dot red"></span></div>
    <a class="pill label js-popup" id="topLive" href="#"><span class="dot live"></span>Live</a>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div>
      <button class="avatar-btn" id="avatarBtn" aria-label="Open stories">
        <span class="avatar-ring"><span class="avatar-inner" id="avatarInner"></span></span>
        <span class="status" id="statusBadge"><span class="dot live"></span>Online</span>
      </button>
      <span class="tap-hint" id="tapHint">Tap to view stories</span>
    </div>
    <div class="identity">
      <div class="eyebrow label"><span class="dot live"></span><span id="eyebrow"></span></div>
      <h1 id="name">Creator</h1>
      <p class="tagline" id="tagline"></p>
      <div class="stats" id="stats"></div>
      <div class="ctas">
        <a class="btn primary js-popup" href="#"><span id="btnWatch">Watch now</span> <span aria-hidden="true">→</span></a>
        <a class="btn ghost js-popup" href="#" id="btnExclusive">Exclusive content</a>
      </div>
    </div>
  </section>

  <section class="strip">
    <div class="strip-left">
      <span class="eyebrow label" style="color:var(--fg)"><span class="dot red"></span>Live now</span>
      <div>
        <h2 id="liveTitle"></h2>
        <p id="liveSub"></p>
      </div>
    </div>
    <a class="textlink label js-popup" href="#">Watch →</a>
  </section>

  <section class="content">
    <div class="content-head">
      <div>
        <div class="label" id="contentEyebrow"></div>
        <h2 id="contentTitle"></h2>
      </div>
      <div class="head-right">
        <span class="label" id="updated"></span>
        <a class="btn ghost js-popup" href="#" style="min-height:44px;padding:0 18px"><span id="btnViewAll">View all content</span> →</a>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span id="footName"></span>
    <a id="dmca" href="#">DMCA</a>
    <span id="footerNote"></span>
  </div>
</footer>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Stories">
  <div class="stage" id="stage">
    <div class="bars" id="bars"></div>
    <div class="vhead">
      <span class="mini" id="vMini"></span><b id="vName"></b>
      <button class="close" id="vClose" aria-label="Close stories">×</button>
    </div>
    <div id="vMedia" style="height:100%"></div>
    <div class="caption" id="vCaption" hidden></div>
    <button class="tap prev" id="tapPrev" aria-label="Previous story"></button>
    <button class="tap next" id="tapNext" aria-label="Next story"></button>
  </div>
</div>

<div class="modal-back" id="popup" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="popName">
    <button class="x" id="popClose" aria-label="Close">×</button>
    <div class="label eb" id="popEyebrow"></div>
    <h3 id="popName"></h3>
    <p class="head" id="popHeadline"></p>
    <ol id="popSteps"></ol>
    <div class="pic" id="popPic"></div>
    <a class="btn primary" id="popJoin" href="#" target="_blank" rel="noopener"></a>
  </div>
</div>

<script>
window.addEventListener("error", function (e) {
  var box = document.getElementById("configError");
  if (!box) return;
  var where = e.filename && e.filename.indexOf("config.js") > -1 ? "config.js, line " + e.lineno : "the page";
  box.textContent = "Something is wrong in " + where + ". Usually a missing comma or quote just above that line. (" + e.message + ")";
  box.hidden = false;
});
</script>

<script src="config.js"></script>

<script>
(function () {
  if (typeof CONFIG === "undefined") {
    var box = document.getElementById("configError");
    if (box.hidden) { box.textContent = "config.js is missing or has a mistake. Make sure it is in the same folder as index.html."; box.hidden = false; }
    return;
  }
  var C = CONFIG;
  var $ = function (id) { return document.getElementById(id); };
  var initial = ((C.name || "?").trim()[0] || "?").toUpperCase();
  var gradients = [
    "linear-gradient(160deg,#ff3d8b,#7a1fff)", "linear-gradient(160deg,#ffb03d,#ff3d8b)",
    "linear-gradient(160deg,#3d8bff,#b43dff)", "linear-gradient(160deg,#1fd1a1,#3d6bff)"
  ];
  function imgOr(el, src, fallback) {
    el.innerHTML = "";
    if (src) { var i = new Image(); i.src = src; i.alt = ""; el.appendChild(i); }
    else if (fallback) el.appendChild(fallback);
  }
  var LOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="16" r="1.2" fill="currentColor"/></svg>';
  function textEl(cls, txt) { var s = document.createElement("span"); s.className = cls; s.textContent = txt; return s; }
  function set(id, txt) { if (txt != null) $(id).textContent = txt; }

  if (C.accentColor) document.documentElement.style.setProperty("--accent", C.accentColor);
  document.title = C.name;
  set("brandName", C.name.split(" ")[0]);
  set("name", C.name);
  set("tagline", C.tagline);
  set("eyebrow", C.eyebrow);
  $("statusBadge").hidden = !C.online;
  imgOr($("avatarInner"), C.avatar, textEl("avatar-initial", initial));
  (C.stats || []).forEach(function (s) {
    var d = document.createElement("div"); d.className = "stat";
    if (s.flag) {
      var f = new Image(); f.className = "flag"; f.alt = s.flag.toUpperCase() + " flag";
      f.src = "https://flagcdn.com/" + s.flag.toLowerCase() + ".svg";
      d.appendChild(f);
    } else {
      d.appendChild(document.createElement("b")).textContent = s.value;
    }
    d.appendChild(textEl("label", s.label));
    $("stats").appendChild(d);
  });
  var b = C.buttons || {};
  set("btnWatch", b.watch); set("btnExclusive", b.exclusive); set("btnViewAll", b.viewAll);
  set("liveTitle", (C.live || {}).title); set("liveSub", (C.live || {}).subtitle);
  var ct = C.content || {};
  set("contentEyebrow", ct.eyebrow); set("contentTitle", ct.title); set("updated", ct.updated);
  (C.grid || []).forEach(function (g, i) {
    var a = document.createElement("a"); a.className = "tile js-popup"; a.href = "#";
    imgOr(a, g.image, g.private ? null : textEl("ph", "Preview " + (i + 1)));
    if (g.private) {
      a.classList.add("private");
      var u = document.createElement("span"); u.className = "unlock";
      u.innerHTML = LOCK_SVG + "<b></b><small></small>";
      u.querySelector("b").textContent = g.title || "Private drop";
      u.querySelector("small").textContent = g.subtitle || "Tap to unlock";
      a.appendChild(u);
    } else if (g.locked) a.appendChild(textEl("lock", "Members"));
    $("grid").appendChild(a);
  });
  set("footName", "© " + new Date().getFullYear() + " " + C.name);
  set("footerNote", C.footerNote);
  if (C.dmcaEmail) $("dmca").href = "mailto:" + C.dmcaEmail; else $("dmca").hidden = true;

  var P = C.popup || {}, pop = $("popup");
  set("popEyebrow", P.eyebrow); set("popName", C.name); set("popHeadline", P.headline);
  (P.steps || []).forEach(function (s, i) { var li = document.createElement("li"); li.textContent = (i + 1) + "- " + s; $("popSteps").appendChild(li); });
  imgOr($("popPic"), P.banner, textEl("ph", "Your banner here"));
  set("popJoin", P.buttonText || "Join for free");
  $("popJoin").href = C.link || "#";
  function openPopup(e) {
    if (e) e.preventDefault();
    if (!$("viewer").hidden) closeStories(true);
    pop.hidden = false; document.body.style.overflow = "hidden"; $("popClose").focus();
  }
  function closePopup() { pop.hidden = true; document.body.style.overflow = ""; }
  document.addEventListener("click", function (e) { var t = e.target.closest(".js-popup"); if (t) openPopup(e); });
  $("popClose").onclick = closePopup;
  pop.addEventListener("click", function (e) { if (e.target === pop) closePopup(); });
  $("popJoin").addEventListener("click", function () { setTimeout(closePopup, 100); });

  var stories = C.stories || [];
  if (!stories.length) { $("tapHint").hidden = true; $("avatarBtn").classList.add("seen"); }
  var idx = 0, start = 0, elapsed = 0, paused = false, raf = null, bars = [];
  stories.forEach(function () {
    var bar = document.createElement("div"); bar.className = "bar"; bar.appendChild(document.createElement("i"));
    $("bars").appendChild(bar); bars.push(bar.firstChild);
  });
  set("vName", C.name);
  imgOr($("vMini"), C.avatar, document.createTextNode(initial));
  function dur() { return (stories[idx].seconds || 5) * 1000; }
  function show(i) {
    idx = i; elapsed = 0;
    var s = stories[idx];
    var ph = document.createElement("div"); ph.className = "story-ph";
    ph.style.background = gradients[idx % gradients.length]; ph.textContent = "Story " + (idx + 1);
    imgOr($("vMedia"), s.image, ph);
    $("vMedia").classList.toggle("private", !!s.private);
    var oldLock = $("stage").querySelector(".story-lock"); if (oldLock) oldLock.remove();
    if (s.private) {
      var lk = document.createElement("a"); lk.href = "#"; lk.className = "story-lock js-popup";
      lk.innerHTML = LOCK_SVG + "<b></b><small></small>";
      lk.querySelector("b").textContent = s.title || "Private drop";
      lk.querySelector("small").textContent = s.subtitle || "Tap to unlock";
      $("stage").appendChild(lk);
    }
    var cap = $("vCaption"); cap.innerHTML = "";
    if (s.caption) cap.appendChild(document.createTextNode(s.caption));
    if (s.button) {
      if (s.caption) cap.appendChild(document.createElement("br"));
      var a = document.createElement("a"); a.href = "#"; a.className = "js-popup"; a.textContent = s.button; cap.appendChild(a);
    }
    cap.hidden = !(s.caption || s.button);
    bars.forEach(function (bar, j) { bar.style.width = j < idx ? "100%" : "0"; });
    start = performance.now(); tick();
  }
  function tick() {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function (now) {
      if (!paused) {
        var p = Math.min(1, (elapsed + now - start) / dur());
        bars[idx].style.width = (p * 100) + "%";
        if (p >= 1) return next();
      }
      tick();
    });
  }
  function next() { idx < stories.length - 1 ? show(idx + 1) : closeStories(); }
  function prev() { show(Math.max(0, idx - 1)); }
  function pause() { if (!paused) { paused = true; elapsed += performance.now() - start; } }
  function resume() { if (paused) { paused = false; start = performance.now(); } }
  function openStories() {
    if (!stories.length) return;
    $("viewer").hidden = false; document.body.style.overflow = "hidden"; paused = false; show(0); $("vClose").focus();
  }
  function closeStories(silent) {
    cancelAnimationFrame(raf); $("viewer").hidden = true; document.body.style.overflow = "";
    $("avatarBtn").classList.add("seen"); if (!silent) $("avatarBtn").focus();
  }
  $("avatarBtn").onclick = openStories;
  $("vClose").onclick = function () { closeStories(); };
  $("tapNext").onclick = next;
  $("tapPrev").onclick = prev;
  var stage = $("stage");
  stage.addEventListener("pointerdown", function (e) { if (!e.target.closest("a, .close")) pause(); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) { stage.addEventListener(ev, resume); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (!pop.hidden) closePopup(); else if (!$("viewer").hidden) closeStories(); }
    if ($("viewer").hidden) return;
    if (e.key === "ArrowRight") next();
    if (e.key === "ArrowLeft") prev();
  });
  document.addEventListener("visibilitychange", function () { document.hidden ? pause() : resume(); });
})();
</script>
</body>
</html>
